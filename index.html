<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BEG–DUB">
<meta name="theme-color" content="#0E0E0E">
<title>BEG–DUB</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="pages" id="pages">

  <!-- 1. Dobro jutro -->
  <section class="page" id="p-gm">
    <div class="label mono" id="gm-date"></div>
    <div class="gm-title">Ko se to meni<br>probudio?</div>
    <button class="gm-btn" id="gm-btn">Emergency dobro jutro</button>
  </section>

  <!-- 2. Odbrojavanje -->
  <section class="page" id="p-home">
    <div class="label mono" id="cd-label">do --</div>
    <div class="big" id="cd-days">--</div>
    <div class="unit" id="cd-unit">dana</div>
    <div class="hms mono" id="cd-hms">--:--:--</div>
    <div class="bar"><div id="cd-bar"></div></div>
    <label class="link mono edit-date">
      izmeni datum
      <input type="datetime-local" id="cd-input">
    </label>

    <div class="together">
      <div class="label mono">zajedno</div>
      <div class="mid" id="tg-days">--</div>
      <div class="sub mono" id="tg-detail"></div>
    </div>
  </section>

  <!-- 3. Daljina -->
  <section class="page" id="p-dist">
    <div class="label mono" id="km-label">vazdušnom linijom</div>
    <button class="big km" id="km">--</button>
    <div class="unit" id="km-unit">km</div>
    <div class="km-dots" id="km-dots"></div>
    <div class="km-hint mono" id="km-hint">dodirni broj</div>
    <div class="map-wrap">
      <svg id="map" preserveAspectRatio="xMidYMid slice"></svg>
    </div>
    <div class="cities" id="cities"></div>
    <button class="link mono" id="cities-edit">drugi gradovi</button>
  </section>

</main>

<nav class="dots" id="dots">
  <button aria-label="Dobro jutro"></button>
  <button aria-label="Odbrojavanje"></button>
  <button aria-label="Daljina"></button>
</nav>

<!-- WhatsApp ekran -->
<div class="wa" id="wa" hidden>
  <header class="wa-head">
    <button class="wa-back" id="wa-back" aria-label="Nazad">
      <svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img src="img/mihailo.jpg" alt="" class="wa-avatar">
    <div class="wa-who">
      <div class="wa-name" id="wa-name"></div>
      <div class="wa-status" id="wa-status">online</div>
    </div>
    <svg class="wa-icon" viewBox="0 0 24 24" width="24" height="24"><rect x="2.5" y="6" width="13" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 10.5 5-3v9l-5-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <svg class="wa-icon" viewBox="0 0 24 24" width="22" height="22"><path d="M6.6 3.5h2.6l1.4 4-2 1.6a12 12 0 0 0 6.3 6.3l1.6-2 4 1.4v2.6a2 2 0 0 1-2.2 2A17 17 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
  </header>
  <div class="wa-chat" id="wa-chat">
    <div class="wa-day">Today</div>
  </div>
  <footer class="wa-input">
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <div class="wa-field"></div>
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.7l1.3-2h5l1.3 2h1.7A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12.5" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    <svg viewBox="0 0 24 24" width="24" height="24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </footer>
</div>

<!-- Promena gradova -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-body">
    <div class="label mono" id="sheet-step">prvi grad</div>
    <input class="sheet-input" id="sheet-input" placeholder="Pariz" autocomplete="off" autocorrect="off" spellcheck="false">
    <ul class="sheet-results" id="sheet-results"></ul>
    <div class="sheet-actions">
      <button class="link mono" id="sheet-reset">vrati Beograd–Dablin</button>
      <button class="link mono" id="sheet-close">zatvori</button>
    </div>
  </div>
</div>

<!-- Tajna poruka -->
<div class="secret" id="secret" hidden>
  <div class="label mono secret-label" id="secret-label"></div>
  <div class="secret-text" id="secret-text"></div>
  <div class="secret-more" id="secret-more"></div>
</div>

<!-- Uvod (samo prvi put) -->
<div class="intro" id="intro" hidden>
  <div class="intro-text" id="intro-text"></div>
  <div class="intro-hint mono">dodirni</div>
</div>

<script src="data.js"></script>
<script src="map-data.js"></script>
<script src="app.js"></script>
</body>
</html>
